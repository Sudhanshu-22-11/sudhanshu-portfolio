<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="rq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a10"/>
      <stop offset="50%" stop-color="#2a0f18"/>
      <stop offset="100%" stop-color="#12060a"/>
    </linearGradient>
    <radialGradient id="rq-glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#rq-bg)"/>
  <rect width="1600" height="1200" fill="url(#rq-glow)"/>

  <!-- Heartbeat ECG line in background -->
  <g stroke="#f43f5e" stroke-opacity="0.12" stroke-width="2" fill="none">
    <path d="M 0,600 L 400,600 L 450,560 L 480,680 L 520,440 L 560,720 L 600,580 L 640,600 L 1000,600 L 1050,560 L 1080,680 L 1120,440 L 1160,720 L 1200,580 L 1240,600 L 1600,600"/>
  </g>

  <!-- Outer Frame -->
  <rect x="70" y="70" width="1460" height="1060" rx="24" fill="none" stroke="#f43f5e" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Top bar status -->
  <g transform="translate(120, 130)">
    <circle cx="10" cy="10" r="6" fill="#fb7185"/>
    <text x="28" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#fb7185">EMERGENCY FIRST-RESPONSE APP</text>
    <text x="1360" y="15" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#fecdd3" fill-opacity="0.7">OFFLINE-FIRST • 12+ LANGUAGES</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(120, 240)">
    <rect x="0" y="0" width="320" height="42" rx="21" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-opacity="0.35"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#fda4af">AI HYBRID &amp; PWA EMERGENCY APP</text>

    <text x="0" y="140" font-family="Georgia, serif" font-style="italic" font-size="108" font-weight="400" fill="#fff1f2" letter-spacing="-1">ResQ-AI</text>

    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="300" fill="#fecdd3" letter-spacing="0.5">Zero-Network Triage, Live SOS Broadcast &amp; Multimodal AI</text>
  </g>

  <!-- Central Visual Cards Mockup -->
  <g transform="translate(120, 520)">
    <!-- Card 1: Hold-to-SOS & GPS -->
    <g transform="translate(0, 0)">
      <rect width="420" height="260" rx="16" fill="#240e16" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#f43f5e" fill-opacity="0.25"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fb7185">01</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#fff1f2" letter-spacing="1">HOLD-TO-SOS</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fecdd3" fill-opacity="0.8">Instant 2-Second Trigger</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#fb7185">GPS SOS</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#fda4af" fill-opacity="0.7">SMS &amp; WhatsApp live dispatch</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#f43f5e" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#fb7185" letter-spacing="1">ONE-TAP EMERGENCY TILES</text>
    </g>

    <!-- Card 2: Offline First-Aid & CPR -->
    <g transform="translate(470, 0)">
      <rect width="420" height="260" rx="16" fill="#240e16" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#f43f5e" fill-opacity="0.25"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fb7185">02</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#fff1f2" letter-spacing="1">OFFLINE TRIAGE</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fecdd3" fill-opacity="0.8">Bundled Protocol Guides</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#fb7185">100 BPM</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#fda4af" fill-opacity="0.7">Haptic &amp; Audio CPR Metronome</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#f43f5e" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#fb7185" letter-spacing="1">ZERO INTERNET REQUIRED</text>
    </g>

    <!-- Card 3: AI Vision & Multilingual -->
    <g transform="translate(940, 0)">
      <rect width="420" height="260" rx="16" fill="#240e16" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#f43f5e" fill-opacity="0.25"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fb7185">03</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#fff1f2" letter-spacing="1">VISION TRIAGE</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fecdd3" fill-opacity="0.8">Groq LLM + Camera Feed</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#fb7185">12+ LANG</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#fda4af" fill-opacity="0.7">Hindi, Tamil, Telugu, Kannada...</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#f43f5e" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#fb7185" letter-spacing="1">MULTIMODAL INJURY TRIAGE</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(120, 890)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#fda4af" fill-opacity="0.6">HYBRID STACK &amp; APIS</text>
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="130" height="44" rx="22" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.4"/>
      <text x="65" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fff1f2">React 19</text>

      <rect x="150" y="0" width="180" height="44" rx="22" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.4"/>
      <text x="240" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fff1f2">Capacitor Android</text>

      <rect x="350" y="0" width="160" height="44" rx="22" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.4"/>
      <text x="430" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fff1f2">Groq Vision AI</text>

      <rect x="530" y="0" width="170" height="44" rx="22" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.4"/>
      <text x="615" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fff1f2">Google Maps / Leaflet</text>

      <rect x="720" y="0" width="140" height="44" rx="22" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.4"/>
      <text x="790" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fff1f2">Firebase</text>

      <rect x="880" y="0" width="180" height="44" rx="22" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-opacity="0.4"/>
      <text x="970" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fff1f2">Haptics &amp; Geolocation</text>
    </g>
  </g>

  <text x="1460" y="1080" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#fb7185" fill-opacity="0.5">github.com/Sudhanshu-22-11/ResQ-AI</text>
</svg>
