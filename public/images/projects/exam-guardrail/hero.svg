<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="eg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="50%" stop-color="#0f2042"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <radialGradient id="eg-glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#eg-bg)"/>
  <rect width="1600" height="1200" fill="url(#eg-glow)"/>

  <!-- Radar/monitoring concentric circles in the background -->
  <g stroke="#3b82f6" stroke-opacity="0.08" fill="none" stroke-width="1">
    <circle cx="1200" cy="400" r="150"/>
    <circle cx="1200" cy="400" r="280"/>
    <circle cx="1200" cy="400" r="420"/>
    <line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="800" y1="400" x2="1600" y2="400"/>
  </g>

  <!-- Outer Frame -->
  <rect x="70" y="70" width="1460" height="1060" rx="24" fill="none" stroke="#3b82f6" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Top bar status -->
  <g transform="translate(120, 130)">
    <circle cx="10" cy="10" r="6" fill="#60a5fa"/>
    <text x="28" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#60a5fa">INTEGRITY-FIRST MONITORING</text>
    <text x="1360" y="15" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#93c5fd" fill-opacity="0.7">TEAM BRAINBYTES • EXAM SURVEILLANCE</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(120, 240)">
    <rect x="0" y="0" width="300" height="42" rx="21" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#93c5fd">ONLINE PROCTORING SYSTEM</text>

    <text x="0" y="140" font-family="Georgia, serif" font-style="italic" font-size="108" font-weight="400" fill="#f8fafc" letter-spacing="-1">Exam Guardrail</text>

    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="300" fill="#bfdbfe" letter-spacing="0.5">Integrity Enforcement &amp; Multi-Candidate Surveillance</text>
  </g>

  <!-- Central Visual Cards Mockup -->
  <g transform="translate(120, 520)">
    <!-- Card 1: Student Environment -->
    <g transform="translate(0, 0)">
      <rect width="420" height="260" rx="16" fill="#0d1b33" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#3b82f6" fill-opacity="0.25"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#60a5fa">01</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="1">STUDENT PORTAL</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#93c5fd" fill-opacity="0.8">Active Environment Locking</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#60a5fa">SECURE</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#bfdbfe" fill-opacity="0.7">Tab &amp; Window violation tracking</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#3b82f6" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" letter-spacing="1">SESSION AUTHENTICATED</text>
    </g>

    <!-- Card 2: Teacher Proctor Dashboard -->
    <g transform="translate(470, 0)">
      <rect width="420" height="260" rx="16" fill="#0d1b33" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#3b82f6" fill-opacity="0.25"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#60a5fa">02</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="1">PROCTOR CONSOLE</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#93c5fd" fill-opacity="0.8">Multi-Candidate Grid</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#60a5fa">REAL-TIME</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#bfdbfe" fill-opacity="0.7">Instant anomaly alerts &amp; logs</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#3b82f6" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" letter-spacing="1">LIVE SURVEILLANCE FEED</text>
    </g>

    <!-- Card 3: Camera & Stream Guard -->
    <g transform="translate(940, 0)">
      <rect width="420" height="260" rx="16" fill="#0d1b33" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#3b82f6" fill-opacity="0.25"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#60a5fa">03</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="1">INTEGRITY GUARD</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#93c5fd" fill-opacity="0.8">Automated Verification</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#60a5fa">0 LATENCY</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#bfdbfe" fill-opacity="0.7">Peer stream verification layer</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#3b82f6" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" letter-spacing="1">EXPRESS / NODE SERVER</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(120, 890)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#93c5fd" fill-opacity="0.6">CORE ARCHITECTURE &amp; TECHNOLOGIES</text>
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="140" height="44" rx="22" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="70" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Node.js</text>

      <rect x="160" y="0" width="140" height="44" rx="22" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="230" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Express.js</text>

      <rect x="320" y="0" width="160" height="44" rx="22" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="400" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">JavaScript ES6</text>

      <rect x="500" y="0" width="150" height="44" rx="22" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="575" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">HTML5 / CSS3</text>

      <rect x="670" y="0" width="170" height="44" rx="22" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="755" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Camera Stream API</text>

      <rect x="860" y="0" width="190" height="44" rx="22" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.4"/>
      <text x="955" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Session Management</text>
    </g>
  </g>

  <text x="1460" y="1080" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#60a5fa" fill-opacity="0.5">github.com/Sudhanshu-22-11/Exam-Guardrail</text>
</svg>
