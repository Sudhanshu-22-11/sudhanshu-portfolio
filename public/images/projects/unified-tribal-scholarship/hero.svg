<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="uts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062b21"/>
      <stop offset="50%" stop-color="#0a3d2f"/>
      <stop offset="100%" stop-color="#041c15"/>
    </linearGradient>
    <radialGradient id="uts-glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f8e7c9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#uts-bg)"/>
  <rect width="1600" height="1200" fill="url(#uts-glow)"/>

  <!-- Geometric patterned background -->
  <g stroke="#f8e7c9" stroke-opacity="0.06" stroke-width="1" fill="none">
    <polygon points="800,100 1100,500 800,900 500,500"/>
    <polygon points="800,220 1000,500 800,780 600,500"/>
    <circle cx="800" cy="500" r="380"/>
  </g>

  <!-- Outer Frame -->
  <rect x="70" y="70" width="1460" height="1060" rx="24" fill="none" stroke="#f8e7c9" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Top bar status -->
  <g transform="translate(120, 130)">
    <circle cx="10" cy="10" r="6" fill="#f8e7c9"/>
    <text x="28" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#f8e7c9">MINISTRY OF TRIBAL AFFAIRS (MoTA)</text>
    <text x="1360" y="15" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#f8e7c9" fill-opacity="0.8">SMART INDIA HACKATHON 2026 PROTOTYPE</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(120, 240)">
    <rect x="0" y="0" width="370" height="42" rx="21" fill="#f8e7c9" fill-opacity="0.12" stroke="#f8e7c9" stroke-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#f8e7c9">AAKANKSHA • UNIFIED SCHOLARSHIP PORTAL</text>

    <text x="0" y="140" font-family="Georgia, serif" font-style="italic" font-size="96" font-weight="400" fill="#fef9ee" letter-spacing="-1">Unified Tribal Scholarship</text>

    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="300" fill="#e8dfce" letter-spacing="0.5">One Profile • One Verification Layer • 5 National Schemes</text>
  </g>

  <!-- Central Visual Cards Mockup -->
  <g transform="translate(120, 520)">
    <!-- Card 1: One Profile -->
    <g transform="translate(0, 0)">
      <rect width="420" height="260" rx="16" fill="#082e23" stroke="#f8e7c9" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#f8e7c9" fill-opacity="0.2"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f8e7c9">01</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#fef9ee" letter-spacing="1">STUDENT PROFILE</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f8e7c9" fill-opacity="0.85">Unified Digital Identity</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#f8e7c9">1 PROFILE</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#e2d4bc" fill-opacity="0.8">Zero repetitive certificate uploads</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#f8e7c9" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#f8e7c9" letter-spacing="1">SEAMLESS ONBOARDING</text>
    </g>

    <!-- Card 2: 5 National Schemes -->
    <g transform="translate(470, 0)">
      <rect width="420" height="260" rx="16" fill="#082e23" stroke="#f8e7c9" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#f8e7c9" fill-opacity="0.2"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f8e7c9">02</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#fef9ee" letter-spacing="1">SCHEMES DASHBOARD</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f8e7c9" fill-opacity="0.85">Pre-Matric to Overseas PhD</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#f8e7c9">5 SCHEMES</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#e2d4bc" fill-opacity="0.8">Instant eligibility calculator</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#f8e7c9" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#f8e7c9" letter-spacing="1">CROSS-SYSTEM CONFLICT CHECK</text>
    </g>

    <!-- Card 3: DBT & Verification -->
    <g transform="translate(940, 0)">
      <rect width="420" height="260" rx="16" fill="#082e23" stroke="#f8e7c9" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#f8e7c9" fill-opacity="0.2"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f8e7c9">03</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#fef9ee" letter-spacing="1">VERIFICATION LAYER</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f8e7c9" fill-opacity="0.85">Direct Benefit Transfer (DBT)</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#f8e7c9">LIVE DBT</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#e2d4bc" fill-opacity="0.8">Disbursement pipeline tracking</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#f8e7c9" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#f8e7c9" letter-spacing="1">SIMULATED GOVERNMENT ADAPTERS</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(120, 890)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#f8e7c9" fill-opacity="0.7">ARCHITECTURE &amp; STACK</text>
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="140" height="44" rx="22" fill="#f8e7c9" fill-opacity="0.15" stroke="#f8e7c9" stroke-opacity="0.4"/>
      <text x="70" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fef9ee">TypeScript</text>

      <rect x="160" y="0" width="120" height="44" rx="22" fill="#f8e7c9" fill-opacity="0.15" stroke="#f8e7c9" stroke-opacity="0.4"/>
      <text x="220" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fef9ee">React</text>

      <rect x="300" y="0" width="140" height="44" rx="22" fill="#f8e7c9" fill-opacity="0.15" stroke="#f8e7c9" stroke-opacity="0.4"/>
      <text x="370" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fef9ee">Node.js</text>

      <rect x="460" y="0" width="150" height="44" rx="22" fill="#f8e7c9" fill-opacity="0.15" stroke="#f8e7c9" stroke-opacity="0.4"/>
      <text x="535" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fef9ee">Express.js</text>

      <rect x="630" y="0" width="160" height="44" rx="22" fill="#f8e7c9" fill-opacity="0.15" stroke="#f8e7c9" stroke-opacity="0.4"/>
      <text x="710" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fef9ee">Tailwind CSS</text>

      <rect x="810" y="0" width="170" height="44" rx="22" fill="#f8e7c9" fill-opacity="0.15" stroke="#f8e7c9" stroke-opacity="0.4"/>
      <text x="895" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#fef9ee">JWT Security</text>
    </g>
  </g>

  <text x="1460" y="1080" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#f8e7c9" fill-opacity="0.6">github.com/Sudhanshu-22-11/sih-unified-tribal-scholarship</text>
</svg>
