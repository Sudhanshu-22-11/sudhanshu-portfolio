<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="fw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a14"/>
      <stop offset="50%" stop-color="#142820"/>
      <stop offset="100%" stop-color="#07100d"/>
    </linearGradient>
    <linearGradient id="fw-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="fw-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#fw-bg)"/>
  <rect width="1600" height="1200" fill="url(#fw-glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#10b981" stroke-opacity="0.08" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="1200"/>
    <line x1="480" y1="0" x2="480" y2="1200"/>
    <line x1="800" y1="0" x2="800" y2="1200"/>
    <line x1="1120" y1="0" x2="1120" y2="1200"/>
    <line x1="1440" y1="0" x2="1440" y2="1200"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="0" y1="1050" x2="1600" y2="1050"/>
  </g>

  <!-- Outer Frame -->
  <rect x="70" y="70" width="1460" height="1060" rx="24" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Top bar status -->
  <g transform="translate(120, 130)">
    <circle cx="10" cy="10" r="6" fill="#10b981"/>
    <text x="28" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#10b981">LIVE DEPLOYED PLATFORM</text>
    <text x="1360" y="15" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#6ee7b7" fill-opacity="0.7">SIH INITIATIVE • CIRCULAR ECONOMY</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(120, 240)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="310" height="42" rx="21" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#34d399">AI-DRIVEN FOOD WASTE MANAGEMENT</text>

    <!-- Main Title -->
    <text x="0" y="140" font-family="Georgia, serif" font-style="italic" font-size="108" font-weight="400" fill="#f0fdf4" letter-spacing="-1">FoodWise</text>

    <!-- Tagline -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="300" fill="#a7f3d0" letter-spacing="0.5">Industrial Mass Balance &amp; Community Relief Platform</text>
  </g>

  <!-- Central Visual Cards Mockup -->
  <g transform="translate(120, 520)">
    <!-- Card 1: Kitchen Telemetry -->
    <g transform="translate(0, 0)">
      <rect width="420" height="260" rx="16" fill="#11221b" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#34d399">01</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#ecfdf5" letter-spacing="1">INSTITUTIONAL MESS</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#a7f3d0" fill-opacity="0.8">Neural Demand Forecasting</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#34d399">-70%</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#6ee7b7" fill-opacity="0.7">Overproduction waste reduced</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#10b981" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="1">IOT TELEMETRY ENABLED</text>
    </g>

    <!-- Card 2: Industrial Mass Balance -->
    <g transform="translate(470, 0)">
      <rect width="420" height="260" rx="16" fill="#11221b" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#34d399">02</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#ecfdf5" letter-spacing="1">INDUSTRIAL PROCESSING</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#a7f3d0" fill-opacity="0.8">Predictive Spoilage Kinetics</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#34d399">100%</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#6ee7b7" fill-opacity="0.7">Circular byproduct accounting</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#10b981" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="1">BIOGAS &amp; FEED RECOVERY</text>
    </g>

    <!-- Card 3: NGO Relief Network -->
    <g transform="translate(940, 0)">
      <rect width="420" height="260" rx="16" fill="#11221b" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="40" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#34d399">03</text>
      <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#ecfdf5" letter-spacing="1">NGO RELIEF NETWORK</text>
      <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#a7f3d0" fill-opacity="0.8">FSSAI Certified Distribution</text>
      <text x="40" y="150" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#34d399">VERIFIED</text>
      <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#6ee7b7" fill-opacity="0.7">Thermal handshakes &amp; OTP</text>
      <line x1="40" y1="210" x2="380" y2="210" stroke="#10b981" stroke-opacity="0.2"/>
      <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="1">DYNAMIC ROUTE LOGISTICS</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(120, 890)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#6ee7b7" fill-opacity="0.6">PRODUCTION TECH STACK</text>
    <g transform="translate(0, 50)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="70" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ecfdf5">Next.js 16</text>
      <!-- Pill 2 -->
      <rect x="160" y="0" width="120" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="220" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ecfdf5">React 19</text>
      <!-- Pill 3 -->
      <rect x="300" y="0" width="140" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="370" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ecfdf5">TypeScript</text>
      <!-- Pill 4 -->
      <rect x="460" y="0" width="160" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="540" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ecfdf5">Prisma ORM</text>
      <!-- Pill 5 -->
      <rect x="640" y="0" width="170" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="725" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ecfdf5">MongoDB Atlas</text>
      <!-- Pill 6 -->
      <rect x="830" y="0" width="160" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="910" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ecfdf5">Tailwind CSS</text>
      <!-- Pill 7 -->
      <rect x="1010" y="0" width="180" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="1100" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#ecfdf5">Framer Motion</text>
    </g>
  </g>

  <!-- Watermark URL -->
  <text x="1460" y="1080" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#10b981" fill-opacity="0.5">https://food-wise-puce.vercel.app</text>
</svg>
