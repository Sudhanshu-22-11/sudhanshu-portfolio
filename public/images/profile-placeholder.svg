    <text x="886" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#efece4" fill-opacity="0.5">EST. 2026</text>
  </g>

