<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1448" viewBox="0 0 1086 1448">
  <defs>
    <linearGradient id="profile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1712"/>
      <stop offset="50%" stop-color="#241e18"/>
      <stop offset="100%" stop-color="#120f0c"/>
    </linearGradient>
    <radialGradient id="profile-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#bb693a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#bb693a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="profile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bb693a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f5e6d3" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#bb693a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
